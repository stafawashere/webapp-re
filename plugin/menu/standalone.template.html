<!doctype html>
<html lang="en">
<head>
   <meta charset="utf-8">
   <meta name="viewport" content="width=device-width, initial-scale=1">
   <title>__TITLE__</title>
   <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
   <style>
      :root {
         --surface-0: #f5f4ef; --surface-1: #f9f8f5; --surface-2: #ffffff;
         --text-primary: #1f1e1b; --text-secondary: #5f5e5a; --text-muted: #888780;
         --border: rgba(31, 30, 27, 0.12); --border-strong: rgba(31, 30, 27, 0.22);
         --bg-accent: #e6f1fb; --text-accent: #185fa5; --border-accent: #85b7eb;
         --bg-success: #eaf3de; --text-success: #3b6d11; --border-success: #97c459;
         --bg-warning: #faeeda; --text-warning: #854f0b;
         --bg-danger: #fcebeb; --text-danger: #a32d2d;
         --bg-neutral: #f1efe8;
         --bg-tint-violet: #eeedfe; --text-tint-violet: #534ab7;
         --bg-tint-aqua: #e1f5ee; --text-tint-aqua: #0f6e56;
         --bg-tint-blue: #e6f1fb; --text-tint-blue: #185fa5;
         --bg-tint-orange: #faece7; --text-tint-orange: #993c1d;
         --bg-tint-green: #eaf3de; --text-tint-green: #3b6d11;
         --bg-tint-red: #fcebeb; --text-tint-red: #a32d2d;
         --bg-tint-yellow: #faeeda; --text-tint-yellow: #854f0b;
         --bg-tint-magenta: #fbeaf0; --text-tint-magenta: #993556;
         --radius: 8px;
         --font-sans: system-ui, -apple-system, "Segoe UI", sans-serif;
         --font-mono: ui-monospace, "SF Mono", Menlo, monospace;
      }
      @media (prefers-color-scheme: dark) {
         :root {
            --surface-0: #1b1b19; --surface-1: #242422; --surface-2: #2c2c2a;
            --text-primary: #f1efe8; --text-secondary: #b4b2a9; --text-muted: #888780;
            --border: rgba(241, 239, 232, 0.12); --border-strong: rgba(241, 239, 232, 0.24);
            --bg-accent: #0c447c; --text-accent: #b5d4f4; --border-accent: #378add;
            --bg-success: #27500a; --text-success: #c0dd97; --border-success: #639922;
            --bg-warning: #633806; --text-warning: #fac775;
            --bg-danger: #791f1f; --text-danger: #f7c1c1;
            --bg-neutral: #444441;
            --bg-tint-violet: #3c3489; --text-tint-violet: #cecbf6;
            --bg-tint-aqua: #085041; --text-tint-aqua: #9fe1cb;
            --bg-tint-blue: #0c447c; --text-tint-blue: #b5d4f4;
            --bg-tint-orange: #712b13; --text-tint-orange: #f5c4b3;
            --bg-tint-green: #27500a; --text-tint-green: #c0dd97;
            --bg-tint-red: #791f1f; --text-tint-red: #f7c1c1;
            --bg-tint-yellow: #633806; --text-tint-yellow: #fac775;
            --bg-tint-magenta: #72243e; --text-tint-magenta: #f4c0d1;
         }
      }
      body { margin: 0 auto; max-width: 760px; padding: 24px 16px; background: var(--surface-0); color: var(--text-primary); font: 16px/1.7 var(--font-sans); }
      button { font: inherit; font-size: 14px; color: var(--text-primary); background: transparent; border: 0.5px solid var(--border-strong); border-radius: var(--radius); padding: 6px 12px; cursor: pointer; }
      button:hover { background: var(--surface-1); }
      input, select { font: inherit; font-size: 14px; color: var(--text-primary); background: var(--surface-2); border: 0.5px solid var(--border-strong); border-radius: var(--radius); height: 36px; padding: 0 10px; box-sizing: border-box; }
      input[type=checkbox] { height: auto; }
      code { font-family: var(--font-mono); }
      .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
   </style>
</head>
<body>
__WIDGET__
</body>
</html>
