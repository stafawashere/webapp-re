x-discovery-notes:
  authentication:
    type: cookie-session (optional)
    session_cookie: sessionid
    login: e-mail magic link, Google or Facebook token to /api/1/identity/sessions (not automated)
  required_headers:
    Citymapper-Region: region id, on searchpost, routestatus and message
    Citymapper-Client: '''Web Search'' on searchpost'
    Content-Type: application/json; charset=utf-8 on every call, form type with a JSON body on searchpost
  anti_bot:
    cdn: cloudflare
    cookie: __cf_bm
    challenges: none observed
    rate_limit: no headers; client paces at 3 s or more
  session:
    initialization: none needed for public reads
    region: explicit region_id on every call
  quirks:
  - name: google-results-without-coords
    description: searchpost Google autocomplete items carry no coords; resolve with placeresolve?id=google:<id>
  - name: departures-per-brand
    description: stopinfo sharing_urls[].departure_api picks departures, metrodepartures or raildepartures
  - name: named-tile-size
    description: everythingmap size must be small or large
  - name: signature-is-a-journey
    description: journey signature is a JSON journey descriptor, deflated and base64 encoded in /trip/signature URLs
