[project]
name = "citymapper-client"
version = "0.1.0"
description = "Local client for the citymapper.com web API, used by the /citymapper skill"
readme = "README.md"
authors = [
    { name = "stafawashere", email = "218852932+stafawashere@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
]

[project.scripts]
citymapper = "citymapper_client.cli:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
